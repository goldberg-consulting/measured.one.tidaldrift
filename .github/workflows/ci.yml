name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install pre-commit and SwiftLint
        run: brew install pre-commit swiftlint

      - name: Run pre-commit hooks
        # no-commit-to-branch guards *local* commits to main; in CI the
        # checkout of main after a merge trips it and fails every push run.
        # CI never commits, so the hook has no value here.
        env:
          SKIP: no-commit-to-branch
        run: pre-commit run --all-files

  homebrew-cask:
    name: Homebrew Cask
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Style cask
        run: brew style Casks/tidaldrift.rb

      - name: Verify cask asset checksum
        run: |
          VERSION=$(ruby -ne 'puts $1 if /^\s*version "([^"]+)"/' Casks/tidaldrift.rb)
          SHA=$(ruby -ne 'puts $1 if /^\s*sha256 "([^"]+)"/' Casks/tidaldrift.rb)
          URL="https://github.com/goldberg-consulting/measured.one.tidaldrift/releases/download/v${VERSION}/TidalDrift-${VERSION}.dmg"
          curl --fail --location --output /tmp/TidalDrift.dmg "$URL"
          echo "${SHA}  /tmp/TidalDrift.dmg" | shasum -a 256 --check

      - name: Install cask in temporary app directory
        run: |
          brew tap-new local/tidaldrift
          mkdir -p "$(brew --repository)/Library/Taps/local/homebrew-tidaldrift/Casks"
          cp Casks/tidaldrift.rb "$(brew --repository)/Library/Taps/local/homebrew-tidaldrift/Casks/tidaldrift.rb"
          brew trust --cask local/tidaldrift/tidaldrift
          mkdir -p "$RUNNER_TEMP/tidaldrift-applications"
          brew install --cask --appdir="$RUNNER_TEMP/tidaldrift-applications" local/tidaldrift/tidaldrift

      - name: Verify installed app version and signature
        run: |
          APP="$RUNNER_TEMP/tidaldrift-applications/TidalDrift.app"
          VERSION=$(ruby -ne 'puts $1 if /^\s*version "([^"]+)"/' Casks/tidaldrift.rb)
          INSTALLED_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")
          echo "Installed TidalDrift ${INSTALLED_VERSION}; cask expects ${VERSION}"
          test "$INSTALLED_VERSION" = "$VERSION"
          test "$BUNDLE_ID" = "com.goldbergconsulting.tidaldrift"
          test -x "$APP/Contents/MacOS/TidalDrift"
          # Require Apple's Developer ID certificate chain, including its application leaf.
          REQUIREMENT='anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists'
          REQUIREMENT+=' and certificate leaf[field.1.2.840.113635.100.6.1.13] exists'
          codesign --verify --deep --strict --test-requirement="$REQUIREMENT" "$APP"

      - name: Uninstall test cask
        if: always()
        run: |
          if brew list --cask local/tidaldrift/tidaldrift >/dev/null 2>&1; then
            brew uninstall --cask local/tidaldrift/tidaldrift
          fi
          test ! -e "$RUNNER_TEMP/tidaldrift-applications/TidalDrift.app"

      - name: Remove temporary tap
        if: always()
        run: |
          if brew tap | grep -Fxq local/tidaldrift; then
            brew untap --force local/tidaldrift
          fi

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        working-directory: TidalDrift
        run: swiftlint lint --reporter github-actions-logging

  spm:
    name: SwiftPM Build and Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Build with Swift Package Manager
        working-directory: TidalDrift
        run: swift build

      - name: Test with Swift Package Manager
        working-directory: TidalDrift
        run: swift test

  xcodebuild:
    name: Xcode Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Build app scheme with xcodebuild
        working-directory: TidalDrift
        run: |
          xcodebuild \
            -scheme TidalDrift \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
